<!-- admin_login.html — Standalone login page with access-code entry. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- ADD THESE ↓ -->
    <meta name="theme-color" content="#EFE6D5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.json">
    <!-- Favicon updated to match logo above 'Management' -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2250%22%20height%3D%2250%22%20viewBox%3D%220%200%2050%2050%22%3E%3Cpath%20d%3D%22M15%2015C15%2010%2020%2010%2025%2010C35%2010%2035%2025%2025%2035C20%2040%2010%2035%2010%2025%22%20stroke%3D%22%233E392F%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22/%3E%3Ccircle%20cx%3D%2235%22%20cy%3D%2215%22%20r%3D%225%22%20fill%3D%22%23E67E22%22/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2250%22%20height%3D%2250%22%20viewBox%3D%220%200%2050%2050%22%3E%3Cpath%20d%3D%22M15%2015C15%2010%2020%2010%2025%2010C35%2010%2035%2025%2025%2035C20%2040%2010%2035%2010%2025%22%20stroke%3D%22%233E392F%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22/%3E%3Ccircle%20cx%3D%2235%22%20cy%3D%2215%22%20r%3D%225%22%20fill%3D%22%23E67E22%22/%3E%3C/svg%3E">
    <title>Admin Access | Joram's Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── LIGHT MODE (default) ── */
        :root {
            --brand-primary: #83934A;
            --brand-secondary: #E67E22;
            --brand-gradient: linear-gradient(135deg, #83934A 0%, #5B6B34 100%);
            --surface-bg: #EFE6D5;
            --surface-card: #FFFFFF;
            --surface-accent: #F9F7F2;
            --text-title: #3E392F;
            --text-body: #6D6659;
            --border-soft: #DED6C4;
            --blob-1: #D48154;
            --blob-2: #8E9775;
            --shadow: rgba(62, 57, 47, 0.18);
        }

        /* ── DARK MODE ── */
        @media (prefers-color-scheme: dark) {
            :root {
                --surface-bg: #161412;
                --surface-card: #1F1C19;
                --surface-accent: #272320;
                --text-title: #EDE5D8;
                --text-body: #9A8F82;
                --border-soft: #36312B;
                --blob-1: #7A3D20;
                --blob-2: #3D4530;
                --shadow: rgba(0, 0, 0, 0.5);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        html, body {
            height: 100%;
            overflow: hidden;
            overflow-x: auto;
        }

        body {
            background-color: var(--surface-bg);
            min-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 20px;
            position: relative;
        }

        /* Organic Background Blobs */
        .blob {
            position: fixed;
            z-index: 0;
            filter: blur(40px);
            opacity: 0.45;
            border-radius: 50%;
            pointer-events: none;
        }
        .blob-1 { width: 500px; height: 500px; background: var(--blob-1); bottom: -100px; left: -150px; }
        .blob-2 { width: 400px; height: 400px; background: var(--blob-2); top: -50px; right: -50px; }

        .login-card {
            background: var(--surface-card);
            width: 100%;
            max-width: 900px;
            border-radius: 28px;
            display: flex;
            box-shadow: 0 30px 80px var(--shadow);
            z-index: 10;
            overflow: hidden;
            animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* Left Side: Form Content */
        .form-side { flex: 1.1; padding: 44px 52px; }

        .form-side h1 {
            font-size: 28px;
            color: var(--text-title);
            margin-bottom: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-body);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .standard-input {
            width: 100%;
            padding: 11px 0;
            border: none;
            border-bottom: 2px solid var(--border-soft);
            font-size: 15px;
            color: var(--text-title);
            background: transparent;
            transition: all 0.3s;
        }
        .standard-input::placeholder { color: var(--text-body); opacity: 0.6; }
        .standard-input:focus { outline: none; border-bottom-color: var(--brand-secondary); }

        /* ADVANCED SECURE CODE BOXES */
        .otp-container { display: flex; gap: 10px; margin-top: 8px; }
        .otp-input {
            width: 100%;
            height: 56px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            border: 2px solid var(--border-soft);
            border-radius: 14px;
            background: var(--surface-accent);
            color: var(--brand-secondary);
            transition: all 0.3s ease;
        }
        .otp-input:focus {
            outline: none;
            border-color: var(--brand-secondary);
            background: var(--surface-card);
            box-shadow: 0 8px 20px rgba(230, 126, 34, 0.18);
            transform: scale(1.05);
        }

        .btn-submit {
            background: var(--brand-gradient);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 16px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.4s;
            box-shadow: 0 12px 28px rgba(131, 147, 74, 0.4);
        }
        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 38px rgba(131, 147, 74, 0.5);
            filter: brightness(1.1);
        }

        /* Right Side: Visual Branding */
        .logo-side {
            flex: 0.9;
            background: var(--surface-accent);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            border-left: 1px solid var(--border-soft);
            position: relative;
        }

        .logo-glow {
            width: 120px;
            height: 120px;
            background: var(--brand-secondary);
            filter: blur(50px);
            position: absolute;
            opacity: 0.15;
        }

        .brand-text {
            margin-top: 25px;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-body);
            opacity: 0.6;
        }

        /* Error Message Overlay */
        .error-banner {
            background: #FFEDEA;
            color: #D63031;
            padding: 13px;
            border-radius: 13px;
            font-size: 13px;
            margin-bottom: 18px;
            border: 1px solid #FAB1A0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        @media (prefers-color-scheme: dark) {
            .error-banner {
                background: #2E1010;
                color: #FF7675;
                border-color: #5C2020;
            }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            html, body { overflow: hidden; overflow-x: auto; }
            .login-card { flex-direction: column-reverse; border-radius: 22px; }
            .logo-side { padding: 36px 20px; border-left: none; border-bottom: 1px solid var(--border-soft); }
            .form-side { padding: 36px 28px; }
            .form-side h1 { text-align: center; font-size: 22px; }
            .otp-input { height: 50px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-card">
        <section class="form-side">
            <h1>Joram's Wholesale and Retail Store</h1>

            {% if messages %}
                {% for message in messages %}
                <div class="error-banner">
                    <span>🚫</span> {{ message }}
                </div>
                {% endfor %}
            {% endif %}

            <form method="POST" id="loginForm">
                {% csrf_token %}
                <div class="input-group">
                    <label>Admin Username</label>
                    <input type="text" name="username" class="standard-input" placeholder="e.g. admin_joram" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label>Admin Password</label>
                    <input type="password" name="password" class="standard-input" placeholder="••••••••" required>
                </div>

                <div class="input-group">
                    <label>Secure Access Code</label>
                    <div class="otp-container" id="otpBox">
                        <input type="password" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
                        <input type="password" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
                        <input type="password" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
                        <input type="password" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
                        <input type="password" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
                        <input type="password" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
                    </div>
                    <input type="hidden" name="access_code" id="access_code_hidden">
                </div>

                <button type="submit" class="btn-submit">Verify & Access Dashboard</button>
            </form>
        </section>

        <aside class="logo-side">
            <div class="logo-glow"></div>
            <svg width="100" height="100" viewBox="0 0 50 50">
                <path d="M15 15C15 10 20 10 25 10C35 10 35 25 25 35C20 40 10 35 10 25" stroke="var(--text-title)" stroke-width="5" stroke-linecap="round"/>
                <circle cx="35" cy="15" r="5" fill="var(--brand-secondary)"/>
            </svg>
            <div class="brand-text">Management</div>
        </aside>
    </div>

    <script src="/static/js/emoji-to-svg.js?v=20260304"></script>
    <style>
        /* Glassmorphic icon styles for login page */
        .gm-icon { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; width: 1.35em; height: 1.35em; flex-shrink: 0; line-height: 1; }
        .gm-icon svg { width: 100%; height: 100%; display: block; overflow: visible; }
    </style>
    <script>
        const otpInputs = document.querySelectorAll('.otp-input');
        const hiddenAccessCode = document.getElementById('access_code_hidden');

        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                input.value = input.value.replace(/[^0-9]/g, '');
                if (input.value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
                combineOTP();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        function combineOTP() {
            let code = "";
            otpInputs.forEach(input => code += input.value);
            hiddenAccessCode.value = code;
        }
    </script>
</body>
</html>
